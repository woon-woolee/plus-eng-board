*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);margin:0;
  font-family:"Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:900px;margin:0 auto;padding:24px 16px 60px;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:"Gothic A1","Noto Sans KR",sans-serif;font-weight:800;margin:0;letter-spacing:-.035em}
h1{font-size:26px} h2{font-size:17px}
.sub{color:var(--ink-2);font-size:13px;margin-top:4px}
.stamp{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);letter-spacing:.04em;

header.top{padding-bottom:14px;border-bottom:1px solid var(--line);

.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-2)}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;

.pad{padding:13px 16px 16px}

.chips{display:flex;flex-wrap:wrap;gap:5px}

  background:var(--panel-2);color:var(--ink-2);border:1px solid var(--line-2);transition:.13s}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:9px}
.c{border:1px solid var(--line);border-left:4px solid var(--bc);border-radius:11px;
  padding:10px 12px;background:var(--panel-2);display:flex;flex-direction:column;gap:3px;position:relative}
.c .hd{display:flex;align-items:baseline;gap:7px;padding-right:24px}

.c .dd{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--bc)}
.c .when{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-2)}
.c .rm{font-size:12px;color:var(--ink-2)}
.c .nt{font-size:12.5px;margin-top:2px;padding-top:5px;border-top:1px dashed var(--line-2);white-space:pre-wrap}

.c.off{--bc:var(--off-tx);background:var(--off-bg);border-color:var(--off-line)}

.past{opacity:.45}

.mnav{display:flex;align-items:center;gap:9px}
.nav{width:30px;height:30px;border-radius:9px;border:1px solid var(--line-2);background:var(--panel-2);

.nav:hover{border-color:var(--accent);color:var(--accent)}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:12px 14px 16px}
.mh{font-size:12px;font-weight:700;color:var(--ink-2);text-align:center;padding:2px 0 5px}
.mc{min-height:76px;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);

.mc.out{opacity:.35}
.mc.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}

.mi.mk{background:var(--mk-bg);color:var(--mk-tx)}
.mi.off{background:var(--off-bg);color:var(--off-tx)}
.mi.nt2{background:var(--nt-bg);color:var(--nt-tx)}

.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld.full{grid-column:1/-1}
.fld label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.fld input,.fld select,.fld textarea{font:inherit;font-size:13.5px;padding:8px 10px;border-radius:9px;

.fld textarea{min-height:52px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.times{display:flex;align-items:center;gap:6px}
.rooms{display:flex;flex-wrap:wrap;gap:4px}
button.rm{font:inherit;font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:500;

.actions{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}
footer{font-size:12px;color:var(--ink-3);line-height:1.7;border-top:1px solid var(--line);padding-top:14px}
.load{color:var(--ink-3);font-size:13px;padding:16px}

.sheet .big{font-family:"IBM Plex Mono",monospace;font-size:27px;font-weight:600;

.sheet .day{font-size:13.5px;color:var(--ink-2);margin-top:3px}
.sheet dl{display:grid;grid-template-columns:58px 1fr;gap:8px 12px;margin:16px 0 0;

.sheet dt{color:var(--ink-3);font-size:12px;font-weight:700;padding-top:3px}
.sheet dd{margin:0;white-space:pre-wrap}
@media (max-width:640px){.sheet{padding:20px 18px 18px}.sheet h3{font-size:22px}.sheet .big{font-size:24px}}

@media (max-width:640px){.wrap{padding:18px 11px 46px}h1{font-size:22px}

<script>
const DAYS=["일","월","화","수","목","금","토"];
const $=id=>document.getElementById(id);
const esc=s=>(s||"").replace(/[<&>"]/g,c=>({'<':'&lt;','&':'&amp;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,"0");
const iso=dt=>`${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
const fmt=m=>`${Math.floor(m/60)}:${pad(m%60)}`;
const md=s=>{const[,m,d]=s.split("-");return +m+"/"+ +d};
const dow=s=>DAYS[new Date(s+"T12:00:00").getDay()];
const TODAY=iso(new Date());
const KN={mk:"보강",off:"휴강",nt2:"공지"};
function dday(d){const q=Math.round((new Date(d)-new Date(TODAY))/864e5);
  return q>0?`D-${q}`:(q===0?"오늘":"지남");}
let ITEMS=[], CLS="전체";

/* 데이터 (이운우T가 수업보드에서 입력한 내용을 옮겨 담습니다) */
try{ ITEMS=JSON.parse($("st").textContent)||[]; }catch(e){ ITEMS=[]; }
const CANEDIT=false;
/* ── 화면 ── */
const WD=["월","화","수","목","금","토","일"];
let VIEW="week", MORE=false;
function mondayOf(d){const x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
let WK=mondayOf(new Date());
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
function clsMatch(it){return CLS==="전체"||it.c==="전체"||it.c===CLS}
function weekNo(d){const f=new Date(d.getFullYear(),d.getMonth(),1,12);
  return Math.floor((d.getDate()+((f.getDay()+6)%7)-1)/7)+1}

/* 이 주에 표시할 블록 모으기 */
function occ(days){
  const out=[], offd=new Set(ITEMS.filter(i=>i.k==="off").map(i=>i.d));
  /* 정규 수업표는 sync_nb.py 가 보드의 「상시 적용」을 반영해 넣어 준다.
     예전 판(k:"cl" 이 없는 데이터)에서도 열리도록 DATA.CL 로 물러선다. */
  const CLI=ITEMS.find(i=>i.k==="cl");
  const CLLIST=(CLI&&CLI.list)||DATA.CL;
  CLLIST.forEach(x=>{
    const d0=days[WD.indexOf(x.d)];
    if(!d0) return;
    if(!x.gf){
      const ov=ITEMS.find(i=>i.k==="clo"&&i.d===d0&&i.cls===x.t);   // 그 주만 바뀐 것
      if(ov&&ov.hide) return;
      const d=(ov&&ov.iso)||d0;
      if(!days.includes(d)||offd.has(d)) return;
      if(!(CLS==="전체"||x.t===CLS)) return;
      out.push({kind:"cls",t:(ov&&ov.t)||x.t,c:x.t,d,
        a:(ov&&ov.a!=null)?ov.a:x.a, b:(ov&&ov.b!=null)?ov.b:x.b,
        r:(ov&&ov.r!=null)?ov.r:x.r, n:""});
      return;
    }
    if(offd.has(d0)) return;
    const ov=ITEMS.find(i=>i.k==="gfo"&&i.d===d0&&i.base===x.key);
    if(ov&&ov.hide) return;
    out.push({id:ov?ov.id:null, gfkey:x.key, kind:"gf",
      t:(ov&&ov.t)||x.t,
      c:"강사 피드백", d:d0, a:(ov&&ov.a!=null)?ov.a:x.a, b:(ov&&ov.b!=null)?ov.b:x.b,
      r:(ov&&ov.r!=null)?ov.r:x.r, n:(ov&&ov.n)||"", who:x.who||[]});
  });
  ITEMS.forEach(i=>{
    if(i.k!=="mk"||!days.includes(i.d)||!clsMatch(i)) return;
    out.push({id:i.id,kind:"mk",t:i.t||(i.n||"").split(" — ")[0]||i.c,c:i.c,
      d:i.d,a:i.a,b:i.b,r:i.r,n:i.n||""});
  });
  return out.sort((p,q)=>p.a-q.a);
}
function week(){
  const days=[...Array(7)].map((_,k)=>iso(addD(WK,k)));
  $("wklab").textContent=`${WK.getMonth()+1}월 ${weekNo(WK)}주차`;
  $("wkrng").textContent=`${md(days[0])}~${md(days[6])}`;
  const B=occ(days);
  let T0=1050,T1=1320;
  B.forEach(o=>{T0=Math.min(T0,o.a);T1=Math.max(T1,o.b)});
  T0=Math.max(480,Math.floor(T0/60)*60); T1=Math.min(1440,Math.ceil(T1/60)*60);
  const PX=1.05, H=(T1-T0)*PX;
  const offd={}, exd={};
  ITEMS.forEach(i=>{ if(i.k==="gfo"||!days.includes(i.d)||!clsMatch(i)) return;
    if(i.k==="off") offd[i.d]=(i.n||"휴강").split(" — ")[0];
    if(i.k==="nt2") (exd[i.d]=exd[i.d]||[]).push(i); });
  $("ghead").innerHTML=`<div></div>`+days.map((d,k)=>{
    const cl=k===6?" sun":(k===5?" sat":"")+(d===TODAY?" now":"");
    return `<div class="gh${cl}">${WD[k]}<span class="dn">${md(d)}</span>`
      +(offd[d]?`<span class="hd2">${esc(offd[d])}</span>`:"")
      +(exd[d]?exd[d].map(i=>`<span class="ex" data-nt="${esc(i.id)}">${esc((i.n||"").split("  ")[0])}</span>`).join(""):"")
      +`</div>`}).join("");
  let ax=`<div class="ax" style="height:${H}px">`;
  for(let m=Math.ceil(T0/60)*60;m<=T1;m+=60) ax+=`<span class="axl" style="top:${(m-T0)*PX}px">${fmt(m)}</span>`;
  ax+=`</div>`;
  const cols=days.map((d,k)=>{
    let h=`<div class="col${offd[d]?" dayoff":""}${d===TODAY?" today":""}" style="height:${H}px">`;
    for(let m=Math.ceil(T0/30)*30;m<=T1;m+=30)
      h+=`<div class="hr${m%60?" half":""}" style="top:${(m-T0)*PX}px"></div>`;
    B.filter(o=>o.d===d).forEach((o,ix)=>{
      h+=`<button type="button" class="blk ${o.kind}" data-b="${d}|${ix}|${o.kind}|${o.a}"
        style="top:${(o.a-T0)*PX}px;height:${Math.max(34,(o.b-o.a)*PX-3)}px">`
        +`<b>${esc(o.t)}</b><span class="tm">${fmt(o.a)}~${fmt(o.b)}${o.r?" · "+esc(o.r):""}</span>`
        +(o.n&&o.n!==o.t?`<span class="nn">${esc(o.n)}</span>`:"")+`</button>`;
    });
    return h+`</div>`}).join("");
  $("gbody").innerHTML=ax+cols;
  const gw=$("wkview"), ti=days.indexOf(TODAY);
  requestAnimationFrame(()=>{ const over=gw.scrollWidth-gw.clientWidth;
    if(over>4){ const cw=(gw.scrollWidth-56)/7;
      gw.scrollLeft=Math.max(0,Math.min(over,(ti>=0?ti:0)*cw-cw*0.4)); } });
  $("gbody").querySelectorAll("[data-b]").forEach(el=>{
    const [d,ix]=el.dataset.b.split("|"); const o=B.filter(x=>x.d===d)[+ix];
    el.onclick=()=>open_(o);
  });
  $("ghead").querySelectorAll("[data-nt]").forEach(el=>el.onclick=()=>{
    const i=ITEMS.find(x=>x.id===el.dataset.nt); if(!i) return;
    open_({kind:"nt2",t:i.t||i.n,c:i.c,d:i.d,a:null,b:null,r:"",n:i.n});});
  Object.keys(offd).forEach(()=>{});
}
/* 크게 보기 */
function open_(o){
  const KT={cls:"정규 수업",gf:"강사 피드백",mk:"보강",off:"휴강",nt2:"공지"};
  $("shK").className="tag "+o.kind; $("shK").textContent=KT[o.kind]||"";
  $("shT").textContent=o.t||o.c;
  $("shTime").textContent=o.a!=null?`${fmt(o.a)} ~ ${fmt(o.b)}`:"시간 없음";
  const q=Math.round((new Date(o.d)-new Date(TODAY))/864e5);
  $("shDay").textContent=`${o.d.slice(0,4)}년 ${md(o.d)}(${dow(o.d)}) · `+(q>0?`D-${q}`:q===0?"오늘":"지난 일정");
  let dl=(o.kind==="gf"&&o.who&&o.who.length)
    ? `<dt>대상</dt><dd>${esc(o.who.join(", "))}</dd>`
    : `<dt>반</dt><dd>${esc(o.c)}</dd>`;
  dl+=`<dt>호실</dt><dd>${o.r?esc(o.r):'<span style="color:var(--off-tx)">아직 정해지지 않았습니다</span>'}</dd>`;
  const body=(o.n||"").trim();
  if(body&&body!==o.t) dl+=`<dt>내용</dt><dd>${esc(body)}</dd>`;
  $("shDl").innerHTML=dl;
  $("mask").hidden=false;
}
$("shX").onclick=()=>$("mask").hidden=true;
$("mask").onclick=e=>{if(e.target===$("mask"))$("mask").hidden=true};
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("mask").hidden=true});

function paint(){
  $("clsrow").innerHTML=["전체",...DATA.C.map(c=>c.n)].map(n=>{
    const cnt=ITEMS.filter(i=>i.k==="mk"&&i.d>=TODAY&&(n==="전체"||i.c==="전체"||i.c===n)).length;
    return `<button type="button" class="cl" data-c="${esc(n)}" aria-pressed="${n===CLS}">${esc(n)}`
      +(cnt?`<span style="opacity:.65;font-size:11px;margin-left:5px">${cnt}</span>`:"")+`</button>`}).join("");
  $("clsrow").querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{CLS=b.dataset.c;paint()});
  const HIDEK=["gfo","cl","clo"];   // 화면 그리기용 항목 — 카드·월간에는 안 뜬다
  const up=ITEMS.filter(i=>!HIDEK.includes(i.k)&&clsMatch(i)&&i.d>=TODAY).sort((p,q)=>p.d<q.d?-1:p.d>q.d?1:(p.a||0)-(q.a||0));
  $("cnt").textContent=up.length?`${up.length}건`:"예정된 일정 없음";
  const show=MORE?up:up.slice(0,9);
  $("list").innerHTML=up.length?show.map(i=>card(i)).join("")
    :`<p class="none">${CLS==="전체"?"":CLS+"의 "}예정된 보강·공지가 없습니다.</p>`;
  $("more").hidden=up.length<=9;
  $("more").textContent=MORE?"접기":`나머지 ${up.length-9}건 더 보기`;
  week(); month();
}
function card(i){
  return `<article class="c ${i.k}${i.d<TODAY?" past":""}">`
    +`<div class="hd"><span class="kd">${KN[i.k]}</span><b>${esc(i.t||i.c)}</b><span class="dd">${dday(i.d)}</span></div>`
    +(i.t&&i.t!==i.c?`<span class="rm" style="font-size:11.5px;color:var(--ink-3)">${esc(i.c)}</span>`:"")
    +`<span class="when">${md(i.d)}(${dow(i.d)})${i.a!=null?` ${fmt(i.a)}~${fmt(i.b)}`:""}</span>`
    +(i.r?`<span class="rm">${esc(i.r)}</span>`:"")
    +(i.n?`<span class="nt">${esc(i.n)}</span>`:"")+`</article>`;
}
function month(){
  const y=WK.getFullYear(), mo=WK.getMonth();
  const first=new Date(y,mo,1,12); first.setDate(first.getDate()-((first.getDay()+6)%7));
  let h=WD.map(d=>`<div class="mh">${d}</div>`).join("");
  for(let k=0;k<42;k++){
    const dt=addD(first,k), d=iso(dt), inM=dt.getMonth()===mo, hol=DATA.HOL[d];
    const its=ITEMS.filter(i=>!["gfo","cl","clo"].includes(i.k)&&i.d===d&&clsMatch(i));
    h+=`<div class="mc${inM?"":" out"}${d===TODAY?" today":""}"><span class="d">${dt.getDate()}</span>`
      +(hol?`<span class="h">${hol}</span>`:"")
      +its.map(i=>{const lab=i.k==="nt2"?((i.n||"").split(/\s/)[0]||i.c):(i.t||(i.c==="전체"?KN[i.k]:i.c));
          return `<div class="mi ${i.k}" data-m="${esc(i.id)}">${i.a!=null?fmt(i.a)+" ":""}${esc(lab)}</div>`}).join("")
      +`</div>`;
  }
  $("mgrid").innerHTML=h;
  $("mgrid").querySelectorAll("[data-m]").forEach(el=>el.onclick=()=>{
    const i=ITEMS.find(x=>x.id===el.dataset.m); if(!i) return;
    open_({kind:i.k,t:i.t||i.c,c:i.c,d:i.d,a:i.a,b:i.b,r:i.r,n:i.n||""});});
}
function setView(v){VIEW=v;
  $("seg").querySelectorAll("[data-v]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===v));
  $("wkview").hidden=v!=="week"; $("mgrid").hidden=v!=="month";
  $("wklab").textContent=v==="month"?`${WK.getFullYear()}년 ${WK.getMonth()+1}월`
    :`${WK.getMonth()+1}월 ${weekNo(WK)}주차`;
  if(v==="month") $("wkrng").textContent=""; else week();
}
$("seg").querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>setView(b.dataset.v));
const step=n=>{WK=VIEW==="month"?mondayOf(new Date(WK.getFullYear(),WK.getMonth()+n,15,12)):addD(WK,7*n);
  paint(); setView(VIEW);};
$("more").onclick=()=>{MORE=!MORE;paint()};
$("prevw").onclick=()=>step(-1);
$("nextw").onclick=()=>step(1);
$("tdy").onclick=()=>{WK=mondayOf(new Date());paint();setView(VIEW)};

/* 폰: 좌우로 밀어 주 넘기기 — 격자(.gwrap)가 가로 스크롤이라 끝에 닿았을 때만 넘긴다 */
(function(){
  const MIN=55, SLOP=1.5, MAXT=900;
  let sx=0, sy=0, st=0, sL=0, live=false;
  const scroller=()=>document.querySelector("#wkview.gwrap")||$("wkview");
  /* 주의: 시간표 칸(.blk)과 월간 항목(.mi)은 전부 button 이다.
     button 을 통째로 막으면 격자 위에서 미는 손짓이 전부 죽는다 — 실제로 그래서 안 됐다.
     여기서는 진짜 입력칸과 반 고르기 칩만 뺀다. */
  const skip=t=>!t||!t.closest||!!t.closest("input,textarea,select,summary,button.cl,.nav,.seg,#more,#tdy,.mask");
  function down(e){
    live=false;
    if(e.touches.length!==1||skip(e.target)) return;
    const t=e.touches[0]; sx=t.clientX; sy=t.clientY; st=Date.now();
    const s=scroller(); sL=s?s.scrollLeft:0; live=true;
  }
  function up(e){
    if(!live) return; live=false;
    const t=e.changedTouches&&e.changedTouches[0]; if(!t) return;
    if(Date.now()-st>MAXT) return;
    const dx=t.clientX-sx, dy=t.clientY-sy;
    if(Math.abs(dx)<MIN||Math.abs(dx)<Math.abs(dy)*SLOP) return;
    if(VIEW==="week"){
      const s=scroller();
      if(s){ const max=s.scrollWidth-s.clientWidth;
        if(dx>0&&sL>2) return;
        if(dx<0&&sL<max-2) return; }
    }
    swallowClick();
    step(dx>0?-1:1);
  }
  /* 밀고 나면 손을 뗄 때 click 이 따라와 「크게 보기」가 열린다 — 그 한 번만 삼킨다 */
  function swallowClick(){
    const eat=e=>{ e.stopPropagation(); e.preventDefault(); };
    document.addEventListener("click",eat,{capture:true,once:true});
    setTimeout(()=>document.removeEventListener("click",eat,{capture:true}),400);
  }
  ["wkview","mgrid"].forEach(id=>{ const el=$(id); if(!el) return;
    el.addEventListener("touchstart",down,{passive:true});
    el.addEventListener("touchend",up,{passive:true});
    el.addEventListener("touchcancel",()=>{live=false},{passive:true});
  });
})();
$("upd").textContent="마지막 갱신 9월 11일 15:23";
paint();
</script>

<script>
const DAYS=["일","월","화","수","목","금","토"];
const $=id=>document.getElementById(id);
const esc=s=>(s||"").replace(/[<&>"]/g,c=>({'<':'&lt;','&':'&amp;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,"0");
const iso=dt=>`${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
const fmt=m=>`${Math.floor(m/60)}:${pad(m%60)}`;
const md=s=>{const[,m,d]=s.split("-");return +m+"/"+ +d};
const dow=s=>DAYS[new Date(s+"T12:00:00").getDay()];
const TODAY=iso(new Date());
const KN={mk:"보강",off:"휴강",nt2:"공지"};
function dday(d){const q=Math.round((new Date(d)-new Date(TODAY))/864e5);
  return q>0?`D-${q}`:(q===0?"오늘":"지남");}
let ITEMS=[], CLS="전체";

/* 데이터 (이운우T가 수업보드에서 입력한 내용을 옮겨 담습니다) */
try{ ITEMS=JSON.parse($("st").textContent)||[]; }catch(e){ ITEMS=[]; }
const CANEDIT=false;
/* ── 화면 ── */
const WD=["월","화","수","목","금","토","일"];
let VIEW="week", MORE=false;
function mondayOf(d){const x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
let WK=mondayOf(new Date());
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
function clsMatch(it){return CLS==="전체"||it.c==="전체"||it.c===CLS}
function weekNo(d){const f=new Date(d.getFullYear(),d.getMonth(),1,12);
  return Math.floor((d.getDate()+((f.getDay()+6)%7)-1)/7)+1}

/* 이 주에 표시할 블록 모으기 */
function occ(days){
  const out=[], offd=new Set(ITEMS.filter(i=>i.k==="off").map(i=>i.d));
  /* 정규 수업표는 sync_nb.py 가 보드의 「상시 적용」을 반영해 넣어 준다.
     예전 판(k:"cl" 이 없는 데이터)에서도 열리도록 DATA.CL 로 물러선다. */
  const CLI=ITEMS.find(i=>i.k==="cl");
  const CLLIST=(CLI&&CLI.list)||DATA.CL;
  CLLIST.forEach(x=>{
    const d0=days[WD.indexOf(x.d)];
    if(!d0) return;
    if(!x.gf){
      const ov=ITEMS.find(i=>i.k==="clo"&&i.d===d0&&i.cls===x.t);   // 그 주만 바뀐 것
      if(ov&&ov.hide) return;
      const d=(ov&&ov.iso)||d0;
      if(!days.includes(d)||offd.has(d)) return;
      if(!(CLS==="전체"||x.t===CLS)) return;
      out.push({kind:"cls",t:(ov&&ov.t)||x.t,c:x.t,d,
        a:(ov&&ov.a!=null)?ov.a:x.a, b:(ov&&ov.b!=null)?ov.b:x.b,
        r:(ov&&ov.r!=null)?ov.r:x.r, n:""});
      return;
    }
    if(offd.has(d0)) return;
    const ov=ITEMS.find(i=>i.k==="gfo"&&i.d===d0&&i.base===x.key);
    if(ov&&ov.hide) return;
    out.push({id:ov?ov.id:null, gfkey:x.key, kind:"gf",
      t:(ov&&ov.t)||x.t,
      c:"강사 피드백", d:d0, a:(ov&&ov.a!=null)?ov.a:x.a, b:(ov&&ov.b!=null)?ov.b:x.b,
      r:(ov&&ov.r!=null)?ov.r:x.r, n:(ov&&ov.n)||"", who:x.who||[]});
  });
  ITEMS.forEach(i=>{
    if(i.k!=="mk"||!days.includes(i.d)||!clsMatch(i)) return;
    out.push({id:i.id,kind:"mk",t:i.t||(i.n||"").split(" — ")[0]||i.c,c:i.c,
      d:i.d,a:i.a,b:i.b,r:i.r,n:i.n||""});
  });
  return out.sort((p,q)=>p.a-q.a);
}
function week(){
  const days=[...Array(7)].map((_,k)=>iso(addD(WK,k)));
  $("wklab").textContent=`${WK.getMonth()+1}월 ${weekNo(WK)}주차`;
  $("wkrng").textContent=`${md(days[0])}~${md(days[6])}`;
  const B=occ(days);
  let T0=1050,T1=1320;
  B.forEach(o=>{T0=Math.min(T0,o.a);T1=Math.max(T1,o.b)});
  T0=Math.max(480,Math.floor(T0/60)*60); T1=Math.min(1440,Math.ceil(T1/60)*60);
  const PX=1.05, H=(T1-T0)*PX;
  const offd={}, exd={};
  ITEMS.forEach(i=>{ if(i.k==="gfo"||!days.includes(i.d)||!clsMatch(i)) return;
    if(i.k==="off") offd[i.d]=(i.n||"휴강").split(" — ")[0];
    if(i.k==="nt2") (exd[i.d]=exd[i.d]||[]).push(i); });
  $("ghead").innerHTML=`<div></div>`+days.map((d,k)=>{
    const cl=k===6?" sun":(k===5?" sat":"")+(d===TODAY?" now":"");
    return `<div class="gh${cl}">${WD[k]}<span class="dn">${md(d)}</span>`
      +(offd[d]?`<span class="hd2">${esc(offd[d])}</span>`:"")
      +(exd[d]?exd[d].map(i=>`<span class="ex" data-nt="${esc(i.id)}">${esc((i.n||"").split("  ")[0])}</span>`).join(""):"")
      +`</div>`}).join("");
  let ax=`<div class="ax" style="height:${H}px">`;
  for(let m=Math.ceil(T0/60)*60;m<=T1;m+=60) ax+=`<span class="axl" style="top:${(m-T0)*PX}px">${fmt(m)}</span>`;
  ax+=`</div>`;
  const cols=days.map((d,k)=>{
    let h=`<div class="col${offd[d]?" dayoff":""}${d===TODAY?" today":""}" style="height:${H}px">`;
    for(let m=Math.ceil(T0/30)*30;m<=T1;m+=30)
      h+=`<div class="hr${m%60?" half":""}" style="top:${(m-T0)*PX}px"></div>`;
    B.filter(o=>o.d===d).forEach((o,ix)=>{
      h+=`<button type="button" class="blk ${o.kind}" data-b="${d}|${ix}|${o.kind}|${o.a}"
        style="top:${(o.a-T0)*PX}px;height:${Math.max(34,(o.b-o.a)*PX-3)}px">`
        +`<b>${esc(o.t)}</b><span class="tm">${fmt(o.a)}~${fmt(o.b)}${o.r?" · "+esc(o.r):""}</span>`
        +(o.n&&o.n!==o.t?`<span class="nn">${esc(o.n)}</span>`:"")+`</button>`;
    });
    return h+`</div>`}).join("");
  $("gbody").innerHTML=ax+cols;
  const gw=$("wkview"), ti=days.indexOf(TODAY);
  requestAnimationFrame(()=>{ const over=gw.scrollWidth-gw.clientWidth;
    if(over>4){ const cw=(gw.scrollWidth-56)/7;
      gw.scrollLeft=Math.max(0,Math.min(over,(ti>=0?ti:0)*cw-cw*0.4)); } });
  $("gbody").querySelectorAll("[data-b]").forEach(el=>{
    const [d,ix]=el.dataset.b.split("|"); const o=B.filter(x=>x.d===d)[+ix];
    el.onclick=()=>open_(o);
  });
  $("ghead").querySelectorAll("[data-nt]").forEach(el=>el.onclick=()=>{
    const i=ITEMS.find(x=>x.id===el.dataset.nt); if(!i) return;
    open_({kind:"nt2",t:i.t||i.n,c:i.c,d:i.d,a:null,b:null,r:"",n:i.n});});
  Object.keys(offd).forEach(()=>{});
}
/* 크게 보기 */
function open_(o){
  const KT={cls:"정규 수업",gf:"강사 피드백",mk:"보강",off:"휴강",nt2:"공지"};
  $("shK").className="tag "+o.kind; $("shK").textContent=KT[o.kind]||"";
  $("shT").textContent=o.t||o.c;
  $("shTime").textContent=o.a!=null?`${fmt(o.a)} ~ ${fmt(o.b)}`:"시간 없음";
  const q=Math.round((new Date(o.d)-new Date(TODAY))/864e5);
  $("shDay").textContent=`${o.d.slice(0,4)}년 ${md(o.d)}(${dow(o.d)}) · `+(q>0?`D-${q}`:q===0?"오늘":"지난 일정");
  let dl=(o.kind==="gf"&&o.who&&o.who.length)
    ? `<dt>대상</dt><dd>${esc(o.who.join(", "))}</dd>`
    : `<dt>반</dt><dd>${esc(o.c)}</dd>`;
  dl+=`<dt>호실</dt><dd>${o.r?esc(o.r):'<span style="color:var(--off-tx)">아직 정해지지 않았습니다</span>'}</dd>`;
  const body=(o.n||"").trim();
  if(body&&body!==o.t) dl+=`<dt>내용</dt><dd>${esc(body)}</dd>`;
  $("shDl").innerHTML=dl;
  $("mask").hidden=false;
}
$("shX").onclick=()=>$("mask").hidden=true;
$("mask").onclick=e=>{if(e.target===$("mask"))$("mask").hidden=true};
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("mask").hidden=true});

function paint(){
  $("clsrow").innerHTML=["전체",...DATA.C.map(c=>c.n)].map(n=>{
    const cnt=ITEMS.filter(i=>i.k==="mk"&&i.d>=TODAY&&(n==="전체"||i.c==="전체"||i.c===n)).length;
    return `<button type="button" class="cl" data-c="${esc(n)}" aria-pressed="${n===CLS}">${esc(n)}`
      +(cnt?`<span style="opacity:.65;font-size:11px;margin-left:5px">${cnt}</span>`:"")+`</button>`}).join("");
  $("clsrow").querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{CLS=b.dataset.c;paint()});
  const HIDEK=["gfo","cl","clo"];   // 화면 그리기용 항목 — 카드·월간에는 안 뜬다
  const up=ITEMS.filter(i=>!HIDEK.includes(i.k)&&clsMatch(i)&&i.d>=TODAY).sort((p,q)=>p.d<q.d?-1:p.d>q.d?1:(p.a||0)-(q.a||0));
  $("cnt").textContent=up.length?`${up.length}건`:"예정된 일정 없음";
  const show=MORE?up:up.slice(0,9);
  $("list").innerHTML=up.length?show.map(i=>card(i)).join("")
    :`<p class="none">${CLS==="전체"?"":CLS+"의 "}예정된 보강·공지가 없습니다.</p>`;
  $("more").hidden=up.length<=9;
  $("more").textContent=MORE?"접기":`나머지 ${up.length-9}건 더 보기`;
  week(); month();
}
function card(i){
  return `<article class="c ${i.k}${i.d<TODAY?" past":""}">`
    +`<div class="hd"><span class="kd">${KN[i.k]}</span><b>${esc(i.t||i.c)}</b><span class="dd">${dday(i.d)}</span></div>`
    +(i.t&&i.t!==i.c?`<span class="rm" style="font-size:11.5px;color:var(--ink-3)">${esc(i.c)}</span>`:"")
    +`<span class="when">${md(i.d)}(${dow(i.d)})${i.a!=null?` ${fmt(i.a)}~${fmt(i.b)}`:""}</span>`
    +(i.r?`<span class="rm">${esc(i.r)}</span>`:"")
    +(i.n?`<span class="nt">${esc(i.n)}</span>`:"")+`</article>`;
}
function month(){
  const y=WK.getFullYear(), mo=WK.getMonth();
  const first=new Date(y,mo,1,12); first.setDate(first.getDate()-((first.getDay()+6)%7));
  let h=WD.map(d=>`<div class="mh">${d}</div>`).join("");
  for(let k=0;k<42;k++){
    const dt=addD(first,k), d=iso(dt), inM=dt.getMonth()===mo, hol=DATA.HOL[d];
    const its=ITEMS.filter(i=>!["gfo","cl","clo"].includes(i.k)&&i.d===d&&clsMatch(i));
    h+=`<div class="mc${inM?"":" out"}${d===TODAY?" today":""}"><span class="d">${dt.getDate()}</span>`
      +(hol?`<span class="h">${hol}</span>`:"")
      +its.map(i=>{const lab=i.k==="nt2"?((i.n||"").split(/\s/)[0]||i.c):(i.t||(i.c==="전체"?KN[i.k]:i.c));
          return `<div class="mi ${i.k}" data-m="${esc(i.id)}">${i.a!=null?fmt(i.a)+" ":""}${esc(lab)}</div>`}).join("")
      +`</div>`;
  }
  $("mgrid").innerHTML=h;
  $("mgrid").querySelectorAll("[data-m]").forEach(el=>el.onclick=()=>{
    const i=ITEMS.find(x=>x.id===el.dataset.m); if(!i) return;
    open_({kind:i.k,t:i.t||i.c,c:i.c,d:i.d,a:i.a,b:i.b,r:i.r,n:i.n||""});});
}
function setView(v){VIEW=v;
  $("seg").querySelectorAll("[data-v]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===v));
  $("wkview").hidden=v!=="week"; $("mgrid").hidden=v!=="month";
  $("wklab").textContent=v==="month"?`${WK.getFullYear()}년 ${WK.getMonth()+1}월`
    :`${WK.getMonth()+1}월 ${weekNo(WK)}주차`;
  if(v==="month") $("wkrng").textContent=""; else week();
}
$("seg").querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>setView(b.dataset.v));
const step=n=>{WK=VIEW==="month"?mondayOf(new Date(WK.getFullYear(),WK.getMonth()+n,15,12)):addD(WK,7*n);
  paint(); setView(VIEW);};
$("more").onclick=()=>{MORE=!MORE;paint()};
$("prevw").onclick=()=>step(-1);
$("nextw").onclick=()=>step(1);
$("tdy").onclick=()=>{WK=mondayOf(new Date());paint();setView(VIEW)};

/* 폰: 좌우로 밀어 주 넘기기 — 격자(.gwrap)가 가로 스크롤이라 끝에 닿았을 때만 넘긴다 */
(function(){
  const MIN=55, SLOP=1.5, MAXT=900;
  let sx=0, sy=0, st=0, sL=0, live=false;
  const scroller=()=>document.querySelector("#wkview.gwrap")||$("wkview");
  /* 주의: 시간표 칸(.blk)과 월간 항목(.mi)은 전부 button 이다.
     button 을 통째로 막으면 격자 위에서 미는 손짓이 전부 죽는다 — 실제로 그래서 안 됐다.
     여기서는 진짜 입력칸과 반 고르기 칩만 뺀다. */
  const skip=t=>!t||!t.closest||!!t.closest("input,textarea,select,summary,button.cl,.nav,.seg,#more,#tdy,.mask");
  function down(e){
    live=false;
    if(e.touches.length!==1||skip(e.target)) return;
    const t=e.touches[0]; sx=t.clientX; sy=t.clientY; st=Date.now();
    const s=scroller(); sL=s?s.scrollLeft:0; live=true;
  }
  function up(e){
    if(!live) return; live=false;
    const t=e.changedTouches&&e.changedTouches[0]; if(!t) return;
    if(Date.now()-st>MAXT) return;
    const dx=t.clientX-sx, dy=t.clientY-sy;
    if(Math.abs(dx)<MIN||Math.abs(dx)<Math.abs(dy)*SLOP) return;
    if(VIEW==="week"){
      const s=scroller();
      if(s){ const max=s.scrollWidth-s.clientWidth;
        if(dx>0&&sL>2) return;
        if(dx<0&&sL<max-2) return; }
    }
    swallowClick();
    step(dx>0?-1:1);
  }
  /* 밀고 나면 손을 뗄 때 click 이 따라와 「크게 보기」가 열린다 — 그 한 번만 삼킨다 */
  function swallowClick(){
    const eat=e=>{ e.stopPropagation(); e.preventDefault(); };
    document.addEventListener("click",eat,{capture:true,once:true});
    setTimeout(()=>document.removeEventListener("click",eat,{capture:true}),400);
  }
  ["wkview","mgrid"].forEach(id=>{ const el=$(id); if(!el) return;
    el.addEventListener("touchstart",down,{passive:true});
    el.addEventListener("touchend",up,{passive:true});
    el.addEventListener("touchcancel",()=>{live=false},{passive:true});
  });
})();
$("upd").textContent="마지막 갱신 9월 11일 15:23";
paint();
